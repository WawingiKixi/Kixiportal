<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KixiPortal</title>
<style>
  :root{
    --bg:#f2f5f3; --card:#fff; --ink:#16231b; --muted:#66756c; --line:#dfe6e1;
    --orange:#ff8a00; --green:#0d5d0f; --verde:#0a7d0d;
    --shadow:0 1px 2px rgba(13,40,20,.06),0 10px 24px -14px rgba(13,40,20,.22);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1712; --card:#17211a; --ink:#e8efe9; --muted:#8fa196; --line:#243229;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -14px rgba(0,0,0,.7);
    }
  }
  *{box-sizing:border-box;margin:0}
  body{
    min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 40px}

  header{
    display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;
    padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:32px;
  }
  .brand{font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--verde)}
  .brand span{color:var(--orange)}
  .brand small{display:block;font-size:13px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:2px}

  .search{
    width:min(100%,280px);padding:10px 14px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;
  }
  .search::placeholder{color:var(--muted)}
  .search:focus{outline:2px solid var(--orange);outline-offset:2px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}

  .card{
    position:relative;display:flex;flex-direction:column;gap:14px;padding:16px;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    color:inherit;text-decoration:none;box-shadow:var(--shadow);
    transition:transform .2s ease,border-color .2s ease;height:250px;
  }
  .card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--green)}
  .card:focus-visible{outline:2px solid var(--orange);outline-offset:3px}

  .logo{
    height:170px;display:grid;place-items:center;padding:10px;
    background:#fff;border:1px solid var(--line);border-radius:10px;
  }
  .logo img{max-width:50%;max-height:100%;object-fit:contain}

  .name{font-weight:700;font-size:15px;letter-spacing:.02em}
  .host{
    margin-top:2px;font:12px ui-monospace,Consolas,monospace;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .go{position:absolute;top:12px;right:14px;color:var(--orange);font-weight:700;opacity:0;transition:opacity .2s}
  .card:hover .go,.card:focus-visible .go{opacity:1}

  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 0;font-size:14px}

  footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
  footer b{color:var(--ink)}

  @media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Kixi<span>Portal</span><small>Aplicações Kixicrédito</small></div>
    <input id="q" class="search" type="search" placeholder="Pesquisar aplicação…" autocomplete="off" aria-label="Pesquisar aplicação">
  </header>

  <main><div id="grid" class="grid"></div></main>

  <footer>Developed by <b>DSO - Kixicrédito</b> &middot; &copy; <span id="ano"></span></footer>
</div>

<script>
  // Para adicionar uma aplicação, basta acrescentar uma linha aqui.
  const apps = [
    { nome: 'Web Site',       url: 'http://www.kixicredito.ao',                 logo: 'logos/kixicredito.svg' },
    { nome: 'KixiSMS',        url: 'http://kixisms.kixicredito.com/',           logo: 'logos/kixisms.png' },
    { nome: 'KixiAgenda',     url: 'https://kixiagenda.kixicredito.com',        logo: 'logos/kixiagenda.png' },
    { nome: 'KixiUtilitário', url: 'http://kixiutilitariov9.kixicredito.com/',  logo: 'logos/kixiutilitario.png' },
    { nome: 'SICAH',          url: 'https://sicah.kixicredito.com/login',       logo: 'logos/logoSICAH.webp' },
    { nome: 'KixiFlow',       url: 'https://kixiflow.kixicredito.com/sign-in',  logo: 'logos/logoKixiFlow.jpg' },
    { nome: 'KixiPedidos',    url: 'http://192.168.5.21/kixifaturacao/public/', logo: 'logos/kixipedidos.png' },
    { nome: 'SSIF',           url: 'https://secure.bna.ao/sslvpn/Login/Login',  logo: 'logos/bna.jpg' },
  ];

  const grid = document.getElementById('grid');
  const q = document.getElementById('q');
  document.getElementById('ano').textContent = new Date().getFullYear();

  const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  let visiveis = apps;

  function render() {
    const termo = norm(q.value.trim());
    visiveis = apps.filter(a => norm(a.nome).includes(termo));

    if (!visiveis.length) {
      grid.innerHTML = '<p class="empty">Nenhuma aplicação encontrada.</p>';
      return;
    }

    grid.innerHTML = visiveis.map(a => `
      <a class="card" href="${a.url}" target="_blank" rel="noopener">
        <span class="go" aria-hidden="true">↗</span>
        <div class="logo"><img src="${a.logo}" alt="" loading="lazy"></div>
        <div>
          <div class="name">${a.nome}</div>
          <div class="host">${new URL(a.url).host}</div>
        </div>
      </a>`).join('');
  }

  q.addEventListener('input', render);
  q.addEventListener('keydown', e => {
    if (e.key === 'Enter' && visiveis.length) window.open(visiveis[0].url, '_blank', 'noopener');
  });

  render();
</script>
</body>
</html>
